; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:rpipico]
platform = https://github.com/maxgerhardt/platform-raspberrypi
board = rpipico
framework = arduino
board_build.core = earlephilhower
; board_build.filesystem_size = 0.5m 
upload_protocol = cmsis-dap
debug_tool = cmsis-dap
debug_speed = 10000
debug_build_flags = -Og -g3
upload_speed = 10000
extra_scripts=pre:add_git_branch.py
lib_deps = 
    ;; core support libraries
    Adafruit TinyUSB Library ; Adafruit TinyUSB Library=https://github.com/doctea/Adafruit_TinyUSB_Arduino/tree/fix/debug-tracing
	ArxTypeTraits
    functional-vlpp
	; khoih-prog=https://github.com/khoih-prog/Functional-Vlpp@>=1.0.2
    ; functional-vlpp=https://github.com/doctea/Functional-Vlpp
    MIDI Library
    SimplyAtomic=https://github.com/wizard97/SimplyAtomic
    uClock  ; uClock=https://github.com/doctea/uClock#fix/external-sync

	;; my custom libraries
    ;https://github.com/doctea/foundling
	;https://github.com/doctea/midihelpers      ;; uncomment these lines if you're not me -doctea
    ;https://github.com/doctea/parameters
    ;https://github.com/doctea/seqlib
    foundling
    midihelpers
    parameters
    seqlib

lib_extra_dirs =  
	lib
	C:\Users\doctea\Documents\Arduino\my_libraries  ;; comment out this line if you're not me -doctea
build_flags = 
    -DUSE_UCLOCK
	-DUSB_MIDI_VID=0x2E8A
	-DUSB_MIDI_PID=0x10C1
	-DUSB_MIDI_MANUFACTURER="\"MusicThing\""
	-DUSB_MIDI_PRODUCT="\"Compulidian\""

    -DUSE_TINYUSB              ;; todo - sync to host device via USB MIDI
    -DENABLE_EUCLIDIAN
    -DENABLE_PARAMETERS        
    -DENABLE_CV_INPUT
    -DFAST_VOLTAGE_READS
    -DENABLE_ACCENTS
    ;-DENABLE_ENVELOPES         ;; todo - output envelope/LFOs on the CV outputs
    ; -DENABLE_CLOCK_INPUT_CV    ;; todo - clock input CV via the pulse inputs
    -DRP2040OutputWrapperClass=WorkshopOutputWrapper
    ;-DENABLE_DEBUG_SERIAL
    -DNUM_GLOBAL_DENSITY_GROUPS=2
    -DSAMPLESET=R808
    -DCALCULATE_SAMPLES_MODE=IN_MAIN_LOOP
    ;-DCALCULATE_SAMPLES_MODE=IN_AUDIO_WORKER
    -DDEFAULT_INTERPOLATION_ENABLED=1
    -DENABLE_SHUFFLE
    -DSEQLIB_DISABLE_PATTERN_EUCLIDIAN_PARAMETERS
    -DCOMPENSATE_ADC_DNL
    -DCOMPENSATE_ADC_LPF_CV
    -DCOMPENSATE_ADC_LPF_KNOB
    -DDEFAULT_CV_PPQN=umodular::clock::uClockClass::PPQNResolution::PPQN_4

; ---------------------------------------------------------------------------
; 16 MB extended-flash Workshop Computer
; ---------------------------------------------------------------------------
; Use this env when your board has a 16 MB flash chip.
; Banks start at 2 MB (past the ~1.73 MB firmware) giving 4 x 3 MB banks,
; leaving ~2 MB of headroom at the top of flash for the LittleFS partition
; (live settings + bank config, via saveloadlib) and the core's own 4 KB
; EEPROM-emulation region - see include/audio/flash_layout.h.
; NOTE: the RP2040 Arduino-Pico builder sizes "FLASH" from board_upload.
; maximum_size (NOT board_build.flash_length, which is a computed output var
; the builder overwrites - setting it directly here has no effect).
; Build: pio run -e rpipico_16mb
; Upload: pio run -e rpipico_16mb --target upload
[env:rpipico_16mb]
extends = env:rpipico
board_upload.maximum_size = 16777216
board_build.filesystem_size = 1m
build_flags =
    ${env:rpipico.build_flags}
    -DFLASH_SIZE_MB=16
    -DENABLE_LITTLEFS
    ; Deliberately NOT defining ENABLE_STORAGE here: that flag gates saveloadlib
    ; integration across the whole of seqlib/parameters/midihelpers (every
    ; Parameter/Sequencer/Pattern/Output becomes save-tree-aware), which is a
    ; huge amount of unneeded code/flash bloat for what we need here. Our own
    ; live-settings code (live_settings.h/settings.cpp/serial_debug.cpp) uses
    ; saveloadlib directly, gated on ENABLE_LITTLEFS instead.

[env:rpipico_16mb_usb_trace]
extends = env:rpipico_16mb
build_type = debug
debug_build_flags = -Os -g3
build_flags =
    ${env:rpipico_16mb.build_flags}
    -DCFG_TUSB_PICO_TRACE=1

